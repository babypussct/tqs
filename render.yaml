# Apply from an isolated verified release snapshot, not the dirty monorepo root.
services:
  - type: web
    name: tqs-mobile-candidate
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    autoDeployTrigger: off
    healthCheckPath: /gateway/healthz
    envVars:
      - key: FK_HOST
        value: 168.110.36.224
      - key: FK_PORT
        value: '9527'
      - key: MAX_CONNECTIONS
        value: '128'
      - key: MAX_WS_PER_IP
        value: '128'
      - key: CONNECT_TIMEOUT_MS
        value: '10000'
